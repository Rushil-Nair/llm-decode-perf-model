mechanism: >
  With per-slot KV (no --kv-unified), llama.cpp's split_equal only batches
  consecutive sequence ids into one ubatch. LRU slot selection scattered the
  busy slot ids, so one decode step became several forward passes, each
  re-reading all weights (decode is memory-bandwidth-bound).
